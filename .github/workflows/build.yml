name: Build releases

# 推送 tag（如 v1.0.0）时自动打包 Windows / Linux 发行包并发布到 GitHub Releases
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install customtkinter dnspython cryptography pypinyin pyinstaller wafw00f

      - name: Build single-file EXE
        run: |
          pyinstaller --onefile --windowed --name CyberCensus --icon docs/logo.ico --add-data "docs/logo.png;docs" --collect-all customtkinter --collect-all pypinyin asm_gui.pyw

      - name: Build standalone wafw00f
        run: |
          pyinstaller --onefile --name wafw00f --collect-all wafw00f packaging/wafw00f_entry.py

      - name: Download enhanced engines (subfinder / httpx / nuclei)
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $headers = @{ 'User-Agent' = 'CyberCensus-build' }
          foreach ($repo in 'subfinder', 'httpx', 'nuclei') {
            $r = Invoke-RestMethod "https://api.github.com/repos/projectdiscovery/$repo/releases/latest" -Headers $headers
            $asset = $r.assets | Where-Object { $_.name -match 'windows_amd64\.zip$' } | Select-Object -First 1
            if (-not $asset) { throw "No windows_amd64 asset for $repo" }
            $zip = "$env:RUNNER_TEMP\$repo.zip"
            Invoke-WebRequest $asset.browser_download_url -OutFile $zip
            Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP\$repo" -Force
            $exe = Get-ChildItem "$env:RUNNER_TEMP\$repo" -Recurse -Filter "$repo.exe" | Select-Object -First 1
            Copy-Item $exe.FullName "dist/$repo.exe"
          }

      - name: Download nuclei templates
        shell: pwsh
        run: |
          # nuclei -update-templates 在部分网络会静默失败/卡住；直接从官方仓库下载 zip 更可靠
          $tpl = Join-Path $env:GITHUB_WORKSPACE "nuclei-templates"
          $zip = Join-Path $env:RUNNER_TEMP "nuclei-templates.zip"
          $tmp = Join-Path $env:RUNNER_TEMP "nuclei-templates-src"
          Invoke-WebRequest "https://codeload.github.com/projectdiscovery/nuclei-templates/zip/refs/heads/main" -OutFile $zip
          if (Test-Path $tmp) { Remove-Item $tmp -Recurse -Force }
          Expand-Archive $zip -DestinationPath $tmp -Force
          $src = Get-ChildItem $tmp -Directory | Select-Object -First 1
          if (Test-Path $tpl) { Remove-Item $tpl -Recurse -Force }
          Move-Item $src.FullName $tpl
          $yaml = Get-ChildItem $tpl -Recurse -Filter *.yaml -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $yaml) { throw "nuclei templates were not downloaded to $tpl" }

      - name: Assemble portable package (exe + tools + templates)
        shell: pwsh
        run: |
          $tpl = Join-Path $env:GITHUB_WORKSPACE "nuclei-templates"
          python packaging/pack_release.py --skip-exe --templates $tpl

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/CyberCensus.exe
            dist/CyberCensus-win64.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true

  linux:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download enhanced engines (linux amd64)
        run: |
          set -euo pipefail
          mkdir -p build_tools
          for repo in subfinder httpx nuclei; do
            url="$(curl -fsSL "https://api.github.com/repos/projectdiscovery/$repo/releases/latest" \
              | jq -r '.assets[] | select(.name | endswith("linux_amd64.zip")) | .browser_download_url' \
              | head -n1)"
            if [ -z "$url" ]; then
              echo "No linux_amd64 asset for $repo"
              exit 1
            fi
            curl -fsSL "$url" -o "/tmp/$repo.zip"
            rm -rf "/tmp/$repo"
            unzip -q "/tmp/$repo.zip" -d "/tmp/$repo"
            bin="$(find "/tmp/$repo" -type f -name "$repo" | head -n1)"
            if [ -z "$bin" ]; then
              echo "binary $repo not found"
              exit 1
            fi
            install -m 0755 "$bin" "build_tools/$repo"
          done

      - name: Download nuclei templates
        run: |
          set -euo pipefail
          curl -fsSL https://codeload.github.com/projectdiscovery/nuclei-templates/zip/refs/heads/main -o /tmp/tpl.zip
          rm -rf /tmp/tpl nuclei-templates
          unzip -q /tmp/tpl.zip -d /tmp/tpl
          mv /tmp/tpl/nuclei-templates-main nuclei-templates
          test -n "$(find nuclei-templates -name '*.yaml' | head -n1)"

      - name: Assemble Linux package
        run: python packaging/pack_linux.py --tools build_tools --templates nuclei-templates

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/CyberCensus-linux-x86_64.tar.gz
            dist/SHA256SUMS-linux.txt
