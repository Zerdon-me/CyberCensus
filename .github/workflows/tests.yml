name: Tests

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt customtkinter

      - name: Run unit tests
        run: |
          python -m unittest discover tests -v
        env:
          PYTHONIOENCODING: utf-8

      - name: GUI smoke test
        continue-on-error: true   # 无交互桌面的 CI 环境可能无法创建窗口
        run: |
          python asm_gui.pyw --smoke
        env:
          PYTHONIOENCODING: utf-8

      - name: CLI smoke test
        run: |
          python cybercensus.py --version
          python cybercensus.py --help
